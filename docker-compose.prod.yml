services:
  backend:
    image: ${DOCKER_HUB_USERNAME}/destiny-backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env

  frontend:
    image: ${DOCKER_HUB_USERNAME}/destiny-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on: [backend]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]

volumes:
  caddy_data:
  caddy_config: